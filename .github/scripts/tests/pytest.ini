# The tests of .github/scripts, run from the repository root with this file as the configuration,
# so that the root's pytest.ini and conftest.py do not apply:
#   python -m pytest -c .github/scripts/tests/pytest.ini -p no:cacheprovider .github/scripts/tests
# They need bash, jq and the usual coreutils on PATH, and no network. requirements.txt lists what
# they need from PyPI.
[pytest]
addopts = --strict-markers --strict-config -ra
xfail_strict = true
filterwarnings = error
python_files = test_*.py
