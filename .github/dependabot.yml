# Dependabot version updates for OPAL.
#
# Every entry has the same shape: weekly on Monday, at most 5 open PRs, minor and patch
# updates grouped into one PR, security updates grouped into another, and each major update
# in a PR of its own. The cooldown holds a new release back for 7 days (14 for a semver-major
# release, on the ecosystems that support it), so a broken or malicious release has time to be
# pulled before a PR proposes it. Security updates are not delayed by it.
version: 2
updates:
  # OPAL's Python dependencies. Each setup.py reads its install_requires from
  # packages/requires.txt and packages/<pkg>/requires.txt. Dependabot's pip fetcher reads
  # every *.txt in a configured directory and its immediate subdirectories whose lines parse
  # as requirements, so "/" covers requirements.txt (dev and test tools) and
  # packages/requires.txt, and each package directory covers its own requires.txt.
  #
  # These are the published packages' ranges, which every downstream install resolves, so a
  # floor must not rise just because a newer release exists. increase-if-necessary leaves a
  # requirement alone while its range admits the new release, and moves only the cap when a
  # release falls outside it. Raising a floor, for a security fix say, stays a manual change.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/packages/opal-common"
      - "/packages/opal-client"
      - "/packages/opal-server"
    versioning-strategy: increase-if-necessary
    schedule: {interval: "weekly", day: "monday"}
    cooldown: {default-days: 7, semver-major-days: 14}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps", prefix-development: "deps-dev"}
    labels: ["dependencies"]
    groups:
      minor-and-patch: {update-types: ["minor", "patch"]}
      # Declared in more than one requires.txt. Without a group, a major update opens one PR
      # per directory, and those PRs have to be merged together to keep the packages in step.
      shared-majors:
        patterns: ["aiohttp", "click", "gitpython", "pyjwt", "tenacity"]
        update-types: ["major"]
      security: {applies-to: "security-updates", patterns: ["*"]}

  # Docusaurus documentation site (pnpm).
  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule: {interval: "weekly", day: "monday"}
    cooldown: {default-days: 7, semver-major-days: 14}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps", prefix-development: "deps-dev"}
    labels: ["dependencies"]
    groups:
      minor-and-patch: {update-types: ["minor", "patch"]}
      security: {applies-to: "security-updates", patterns: ["*"]}

  # The published images. Dependabot reads FROM lines only, so it cannot see the OPA image
  # (copied by skopeo from ARG opa_tag/opa_digest) or the EOPA binary (a wget URL checked
  # against ARG checksums); bump those by hand. It does not update the two `alpine:latest`
  # stages either. The python bases are two-part tags without a digest (python:3.12-bookworm),
  # so Dependabot has nothing to offer inside 3.12, and the ignore below holds the minor: no
  # python base PRs come from this entry. Today it tracks permitio/cedar-agent.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule: {interval: "weekly", day: "monday"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps"}
    labels: ["dependencies"]
    groups:
      minor-and-patch: {update-types: ["minor", "patch"]}
      security: {applies-to: "security-updates", patterns: ["*"]}
    ignore:
      # opal-server's python_requires stops below 3.13, and the Dockerfile hard-codes the
      # python3.12 site-packages path, so a python minor bump here would only be a red PR.
      # Lift this when opal-server supports the next minor and the Dockerfile moves with it.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Test-only image for app-tests/git-leak. Its python base is not tied to opal-server's
  # range, so nothing is held here.
  - package-ecosystem: "docker"
    directory: "/app-tests/git-leak/seed"
    schedule: {interval: "weekly", day: "monday"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps"}
    labels: ["dependencies"]
    groups:
      minor-and-patch: {update-types: ["minor", "patch"]}
      security: {applies-to: "security-updates", patterns: ["*"]}

  # Workflow actions, pinned to commit SHAs with a version comment that Dependabot updates
  # with the SHA. on_release.yml stays on older majors on purpose: it runs only when a release
  # is published, so each major bump arrives as its own PR, to be checked before a release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps"}
    labels: ["dependencies"]
    groups:
      minor-and-patch: {update-types: ["minor", "patch"]}
      security: {applies-to: "security-updates", patterns: ["*"]}

  # Hook revisions in .pre-commit-config.yaml (SHA-frozen, with a `# frozen: vX.Y.Z` comment).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule: {interval: "weekly", day: "monday"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps"}
    labels: ["dependencies"]
    groups:
      minor-and-patch: {update-types: ["minor", "patch"]}
      security: {applies-to: "security-updates", patterns: ["*"]}
    ignore:
      # The formatters are pinned on purpose (see .pre-commit-config.yaml): a bump rewrites
      # files across the tree, so it cannot pass CI as a Dependabot PR and has to land by hand
      # together with the reformat. Lift an entry once its formatter is replaced or brought
      # current that way.
      - dependency-name: "https://github.com/psf/black"
      - dependency-name: "https://github.com/pycqa/isort"
      - dependency-name: "https://github.com/PyCQA/docformatter"
