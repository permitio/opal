# Dependabot version and security updates.
# https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
# describes the options.
#
# - Every entry runs weekly on Monday with at most 5 open pull requests. The cooldown holds a
#   new release back for 7 days, and a major release for 14 on pip, uv and npm, the ecosystems
#   that support per-level days, so a broken or malicious release has time to be pulled first.
# - The version update groups take minor and patch releases only: a major release gets a pull
#   request of its own.
# - Security updates are a repository setting. The security group of an entry puts all of its
#   security updates in one pull request; cooldown and open-pull-requests-limit do not apply to
#   them. Dependabot has no security updates for docker or pre-commit, so those entries have no
#   security group.
# - No labels: Dependabot applies its default labels, dependencies and one for the ecosystem, and
#   creates them when the repository does not have them.
# - Commit prefixes: deps for what the published packages and images install, deps-dev for the
#   tools that build and check them (actions, hooks, docs site).
# - An ignore entry needs a comment that says why, and when it can go.
version: 2
updates:
  # The hand-written requirement files: the published packages' ranges and the root
  # requirements.txt (dev and test tools). Each setup.py reads its install_requires from
  # packages/requires.txt and packages/<pkg>/requires.txt. Dependabot's pip fetcher reads every
  # *.txt and *.in in a configured directory and its immediate subdirectories whose lines parse
  # as requirements, so "/" covers requirements.txt and packages/requires.txt, and each package
  # directory covers its own requires.txt. The locks that uv pip compile writes belong to the uv
  # entries below: exclude-paths keeps app-tests' lock out of "/", and the other locks sit two or
  # more levels down, out of its reach.
  #
  # These are library ranges, which every downstream install resolves, so a floor must not rise
  # just because a newer release exists: increase-if-necessary leaves a requirement alone while
  # its range admits the new release, and moves only the cap when a release falls outside it.
  # Raising a floor, for a security fix say, stays a manual change.
  - package-ecosystem: pip
    directories:
      - /
      - /packages/opal-common
      - /packages/opal-client
      - /packages/opal-server
    exclude-paths:
      - app-tests/requirements.*
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      # Declared in more than one requires.txt. Without a group, a major update opens one pull
      # request per directory, and those have to be merged together to keep the packages in step.
      shared-majors:
        applies-to: version-updates
        patterns: [aiohttp, click, gitpython, pyjwt, tenacity]
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The images' lock: docker/lock/requirements.txt, which uv pip compile writes from
  # docker/lock/requirements.in (the four requires.txt files, pip and setuptools), with every
  # file's hash. The uv ecosystem compiles it again with uv and the options its header records,
  # so the hashes stay complete; the pip ecosystem would compile it with pip-compile instead.
  # /docker/lock is two levels down, out of reach of the "/" entry above, so this entry is the
  # lock's only one. lockfile-only: the ranges belong to the entry above, and a release outside a
  # range reaches the lock after that entry widens the range.
  - package-ecosystem: uv
    directory: /docker/lock
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The test and CI tools' locks, each compiled with uv pip compile from the requirements.in beside
  # it, which pins the tools exactly: app-tests (the E2E suite) and app-tests/git-leak (the scope
  # bed), which the /app-tests job both reads, docker/server-test (the server-test image) and
  # .github/scripts/tests (the workflow scripts' tests). As for the images' lock, the uv ecosystem
  # compiles a lock again with uv and the options its header records. Each header's command runs
  # in the directory of the job that owns the lock, so the "via" paths Dependabot writes are the
  # ones in the file. increase moves the exact pins in the requirements.in files.
  - package-ecosystem: uv
    directories:
      - /app-tests
      - /docker/server-test
      - /.github/scripts/tests
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps-dev
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The Docusaurus documentation site (pnpm).
  - package-ecosystem: npm
    directory: /documentation
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps-dev
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The published images. Dependabot reads FROM lines only, so it cannot see the OPA image
  # (copied by skopeo from ARG opa_tag/opa_digest) or the EOPA binary (a wget URL checked against
  # ARG checksums); bump those by hand. It tracks the digest of wolfi-base:latest, the one base of
  # every stage and the only way its own packages (glibc, openssl, ...) move, and
  # permitio/cedar-agent. Python is Wolfi's python-3.14 package, newest at each build.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # The test-only image of app-tests/git-leak, on the same wolfi-base digest.
  - package-ecosystem: docker
    directory: /app-tests/git-leak/seed
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps-dev
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # The Grype release that .github/scripts/image_gate.py runs, pinned in .github/grype/Dockerfile.
  - package-ecosystem: docker
    directory: /.github/grype
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # The actions that the workflows in .github/workflows use, each pinned to a commit SHA with a
  # version comment, which Dependabot updates together. on_release.yml stays on older majors on
  # purpose: it runs only when a release is published, so each major update arrives as a pull
  # request of its own, to be checked before a release. The cooldown has no per-level days here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps-dev
    groups:
      tooling:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The hooks in .pre-commit-config.yaml. Each rev is a commit SHA with a "# frozen: <tag>"
  # comment: Dependabot moves the SHA to the newest tag's commit and rewrites the comment. The
  # cooldown has no per-level days here.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps-dev
    groups:
      tooling:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A formatter bump can rewrite files across the tree, so it cannot pass CI as a Dependabot
      # pull request and has to land by hand together with the reformat. ruff changes its
      # formatting only in minor releases, so its patch releases still come through.
      - dependency-name: https://github.com/astral-sh/ruff-pre-commit
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
