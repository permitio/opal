# Release binaries that CI and the scheduled security scan download, each pinned by version and
# sha256. The digest job of .github/workflows/security.yml reports newer releases that are at
# least 7 days old; move an entry to one by hand, with the sha256 sums from the release's own
# checksum files.
#
# .github/scripts/fetch-tool.sh <name> reads this file. It downloads the entry's release for the
# machine it runs on, checks the sha256 before it unpacks anything, and installs the binary as
# bin/<name>. It exits 2 when the lock is missing, has no complete entry for the name or this
# platform, bin/<name> exists and is not a regular file, the download fails, the sha256 does not
# match, or the binary cannot be unpacked or installed.
#
# Each entry starts with a [name] line and holds "key = value" lines. Blank lines and lines that
# start with # are ignored.
#
#   version                 the release version, as the URL spells it without a "v" prefix
#   url                     the download URL, https only; {version}, {os} and {arch} are
#                           replaced with the version and the platform's names
#   archive                 the download's format: tar.gz, the only one fetch-tool.sh unpacks
#   binary                  the binary's path inside the archive, as tar -tzf lists it; the same
#                           placeholders are replaced
#   os.<os>                 optional: the release's name for an OS (darwin, linux) when it
#                           differs, such as os.darwin = macOS
#   arch.<arch>             optional: the release's name for an architecture (amd64, arm64) when
#                           it differs, such as arch.amd64 = x86_64
#   sha256.<os>/<arch>      the download's sha256 in lowercase hex; every entry has one for each
#                           of darwin/arm64, darwin/amd64, linux/amd64 and linux/arm64

[gitleaks]
version = 8.30.1
url = https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_{os}_{arch}.tar.gz
archive = tar.gz
binary = gitleaks
arch.amd64 = x64
sha256.darwin/arm64 = b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
sha256.darwin/amd64 = dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
sha256.linux/amd64 = 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
sha256.linux/arm64 = e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080

