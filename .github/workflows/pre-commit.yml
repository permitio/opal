name: pre-commit

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs; runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: 3.12.x
    - name: install pre-commit
      run: python -m pip install pre-commit==4.7.0
    - name: show environment
      run: python -m pip freeze --local
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: run pre-commit
      env:
        SKIP: zizmor
      run: pre-commit run --show-diff-on-failure --color=always --all-files
    # On its own so that only zizmor gets the token, which turns on its online audits
    # (impostor commits, known-vulnerable actions, ref confusion).
    - name: run zizmor with online audits
      env:
        GH_TOKEN: ${{ github.token }}
      run: pre-commit run zizmor --show-diff-on-failure --color=always --all-files
