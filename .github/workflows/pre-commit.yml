# Runs every hook in .pre-commit-config.yaml on every file with prek. The job keeps the name
# pre-commit, which the branch ruleset requires.
name: pre-commit

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs; runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # The number of hooks in .pre-commit-config.yaml; change it when a hook is added or removed.
  EXPECTED_HOOKS: "12"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The Python hooks run on 3.12 (default_language_version in .pre-commit-config.yaml).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.12.x
      - name: Install prek
        run: |
          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          .github/scripts/fetch-tool.sh prek
      # zizmor runs its online audits with GH_TOKEN (impostor commits, known-vulnerable actions,
      # tags that do not match their version comment).
      - name: Run the hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prek-count.sh
