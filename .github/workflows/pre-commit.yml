# Runs every hook in .pre-commit-config.yaml on every file with prek. The job keeps the name
# pre-commit, which the branch ruleset requires.
name: pre-commit

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs; runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # The number of hooks in .pre-commit-config.yaml; change it when a hook is added or removed.
  EXPECTED_HOOKS: "17"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # 3.14, the one Python of OPAL, runs the Python hooks and the workflow scripts' tests below.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.14.x
      - name: Install prek
        run: |
          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          .github/scripts/fetch-tool.sh prek
      # zizmor runs its online audits with GH_TOKEN (impostor commits, known-vulnerable actions,
      # tags that do not match their version comment).
      - name: Run the hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prek-count.sh
      # The scripts that decide the required checks: ci-aggregate.sh (CI) and prek-count.sh (this
      # job), each run on made-up results.
      - name: Test the check scripts
        run: |
          .github/scripts/tests/ci-aggregate.test.sh
          .github/scripts/tests/prek-count.test.sh
      # The pytest tests of the scripts in .github/scripts and of the workflows' facts, with pytest
      # and PyYAML installed from the hash-pinned .github/scripts/tests/requirements.txt.
      # test_security_scan.py downloads gitleaks and TruffleHog with fetch-tool.sh.
      - name: Test the workflow scripts
        run: |
          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          .github/scripts/fetch-tool.sh uv
          venv=$RUNNER_TEMP/script-tests
          bin/uv venv --quiet --python 3.14 "$venv"
          bin/uv pip install --quiet --python "$venv/bin/python" --require-hashes \
            -r .github/scripts/tests/requirements.txt
          "$venv/bin/python" -m pytest -c .github/scripts/tests/pytest.ini -p no:cacheprovider \
            .github/scripts/tests

  # On a push to master only, when the pre-commit check did not pass: a notice to the security
  # Slack channel, as tests.yml's notify job sends for CI.
  notify:
    needs: [pre-commit]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.pre-commit.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: security-scan
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Post to Slack
        env:
          RESULT: ${{ needs.pre-commit.result }}
          SECURITY_SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
        run: .github/scripts/notify.sh pre-commit "$RESULT on master at ${GITHUB_SHA:0:12}"
