# The release. When a GitHub release is published, it builds every image and the three Python
# packages once, gates and tests those builds, and then publishes the same bytes: each image's
# archive to Docker Hub, and the packages to PyPI and to the release's assets. The publish jobs
# run in the docker-hub and pypi environments, whose protection rules decide who may release.
#
# Every platform that is published passes the image gate (Trivy, Grype and the waivers): the
# amd64 and the arm64 image of each archive are scanned, the arm64 one without running it. The
# functional checks (the installed version and the example stack) run the amd64 images only.
#
# On a pull request that changes what the release builds, the same workflow runs as a dry run:
# it builds, gates and tests everything under the version 0.0.0-dev<run number> and publishes
# nothing.
name: Release

on:
  release:
    # job will automatically run after a new "release" is create on github.
    types: [published]
  pull_request:
    paths:
      - docker/**
      - scripts/**
      - packages/__packaging__.py
      - packages/requires.txt
      - packages/*/requires.txt
      - packages/*/setup.py
      - semver2pypi.py
      - .github/workflows/on_release.yml
      - .github/scripts/image_gate.py
      - .github/scripts/trivy.sh
      - .github/image-waivers.toml
      - .github/grype/**
      - .github/binaries.lock
      - .github/scripts/fetch-tool.sh
      - .dockerignore

# Each job grants itself only what it uses.
permissions: {}

# A new push to a PR cancels that PR's older dry runs; a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # As in tests.yml: no build provenance in the metadata file build-push-action prints, which
  # would put a pull request's title and description in the public log, and no build record
  # uploaded as an artifact.
  BUILDX_METADATA_PROVENANCE: disabled
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # The version everything is built as. On a release: the tag, which must agree with the
  # prerelease flag (a pre-release tag has a semver prerelease identifier such as -rc1, and a GA
  # tag has none), and its PyPI form from semver2pypi.py. On a pull request: 0.0.0-dev<run number>.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pypi: ${{ steps.version.outputs.pypi }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Python setup
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Set the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" != release ]; then
            TAG="0.0.0-dev${RUN_NUMBER}"
            IS_PRERELEASE=true
          fi
          # Strip optional 'v' prefix for checking
          VERSION="${TAG#v}"
          # Check if the tag contains a prerelease identifier (hyphen after version numbers)
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
            TAG_IS_PRERELEASE="true"
          else
            TAG_IS_PRERELEASE="false"
          fi
          echo "Tag: $TAG, tag_is_prerelease: $TAG_IS_PRERELEASE, release_is_prerelease: $IS_PRERELEASE"
          if [ "$IS_PRERELEASE" = "true" ] && [ "$TAG_IS_PRERELEASE" = "false" ]; then
            echo "::error::Release is marked as pre-release but tag '$TAG' has no pre-release identifier (e.g. -rc1, -beta1, -alpha1). Pre-release tags must include a semver pre-release suffix."
            exit 1
          fi
          if [ "$IS_PRERELEASE" = "false" ] && [ "$TAG_IS_PRERELEASE" = "true" ]; then
            echo "::error::Tag '$TAG' has a pre-release identifier but the release is not marked as pre-release. Either mark the release as pre-release or use a GA tag (e.g. 0.8.0)."
            exit 1
          fi
          pip install semver==3.1.0 packaging==26.3
          pypi_version=$(python semver2pypi.py "$VERSION")
          if [ -z "$pypi_version" ]; then
            echo "::error::semver2pypi.py gave no PyPI version for '$VERSION'"
            exit 1
          fi
          echo "Tag: $TAG, PyPI version: $pypi_version"
          {
            echo "tag=$TAG"
            echo "pypi=$pypi_version"
            echo "prerelease=$IS_PRERELEASE"
          } >>"$GITHUB_OUTPUT"

  # Each image, for linux/amd64 and linux/arm64, built once from this checkout with the version
  # set, into an OCI archive that the later jobs test and publish as it is. Release images build
  # without a registry cache: layers from an earlier image must not end up in a release.
  build-images:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            repository: permitio/opal-client
            target: client
          - name: client-standalone
            repository: permitio/opal-client-standalone
            target: client-standalone
          - name: client-cedar
            repository: permitio/opal-client-cedar
            target: client-cedar
          - name: client-eopa
            repository: permitio/opal-client-eopa
            target: client-eopa
          - name: server
            repository: permitio/opal-server
            target: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set the version in packages/__packaging__.py
        env:
          PYPI_VERSION: ${{ needs.version.outputs.pypi }}
        run: |
          sed -i "s/__version__ = VERSION_STRING/__version__ = \"$PYPI_VERSION\"/" packages/__packaging__.py
          # If the sed stops matching, the images would silently install 0.0.0 again
          if ! grep -qF "__version__ = \"$PYPI_VERSION\"" packages/__packaging__.py; then
            echo "::error::packages/__packaging__.py does not carry the version '$PYPI_VERSION'"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Build from this checkout, which holds the version set above. Without a context the
          # action builds from the Git context (the tagged commit), and the images installed the
          # packages as 0.0.0.
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          # On a release, BuildKit attaches an SLSA provenance (max: the build's full
          # definition, with this repository and commit as its source) and an SPDX SBOM to
          # each platform's image; the archive carries them to Docker Hub. A dry run attaches
          # none: buildx would put the pull request's event in the provenance.
          provenance: ${{ github.event_name == 'release' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Keep the archive for the jobs that test and publish it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 3

  # Both images of each archive, loaded into Docker: every image of both platforms passes the
  # image gate (the EOPA client is reported only: its EOPA binary is the last upstream release,
  # and its findings can no longer be fixed). The arm64 images are only scanned; the amd64 ones
  # must also install the release version, and the client and the server run the example stack.
  test-images:
    needs: [version, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the image archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Load the amd64 and the arm64 images
        env:
          IMAGES: ${{ runner.temp }}/images
        run: |
          for name in client client-standalone client-cedar client-eopa server; do
            archive=$IMAGES/image-$name/image.tar
            skopeo copy --override-os linux --override-arch amd64 \
              "oci-archive:$archive" "docker-daemon:permitio/opal-$name:test"
            # Docker keeps an image of another platform; it is saved and scanned, never run.
            skopeo copy --override-os linux --override-arch arm64 \
              "oci-archive:$archive" "docker-daemon:permitio/opal-$name:test-arm64"
          done

      - name: Gate the images on Trivy and Grype
        # .github/scripts/image_gate.py scans each image with Trivy and with Grype and fails on a
        # fixable HIGH or CRITICAL vulnerability that no waiver in force in
        # .github/image-waivers.toml covers. The job summary lists what blocked and what is waived.
        # A failure here stops the release before any image is published.
        run: >-
          .github/scripts/image_gate.py --summary "$GITHUB_STEP_SUMMARY"
          --report-only permitio/opal-client-eopa:test
          --report-only permitio/opal-client-eopa:test-arm64
          permitio/opal-client:test permitio/opal-client-standalone:test
          permitio/opal-client-cedar:test permitio/opal-server:test
          permitio/opal-client:test-arm64 permitio/opal-client-standalone:test-arm64
          permitio/opal-client-cedar:test-arm64 permitio/opal-server:test-arm64

      - name: Check that each image installs the release version
        env:
          EXPECTED: ${{ needs.version.outputs.pypi }}
        run: |
          for name in client client-standalone client-cedar client-eopa server; do
            image=permitio/opal-$name:test
            actual=$(docker run --rm --entrypoint pip "$image" show opal-common | sed -n 's/^Version: //p')
            echo "$image installs opal-common $actual"
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::$image installs opal-common '$actual', expected '$EXPECTED'"
              exit 1
            fi
          done

      # The example stack below runs the OPA client; the Cedar and EOPA clients must start their
      # engines too. Each engine answers its health check without an OPAL server.
      - name: Check that the Cedar and EOPA clients start their engines
        run: |
          for spec in client-cedar:8180 client-eopa:8181; do
            name=${spec%%:*} port=${spec##*:}
            docker run -d --rm --name "$name" -p "$port:$port" "permitio/opal-$name:test"
            if ! ./scripts/wait-for.sh -t 60 "http://localhost:$port/health"; then
              docker logs "$name"
              echo "::error::permitio/opal-$name:test did not start its engine"
              exit 1
            fi
            docker stop "$name"
          done

      - name: Create modified docker compose file
        run: sed 's/:latest/:test/g' docker/docker-compose-example.yml > docker/docker-compose-test.yml

      - name: Bring up stack
        run: docker compose -f docker/docker-compose-test.yml up -d

      - name: Check if OPA is healthy
        run: ./scripts/wait-for.sh -t 60 http://localhost:8181/v1/data/users -- sleep 10 && curl -s "http://localhost:8181/v1/data/users" | jq '.result.bob.location.country == "US"'

      - name: Output container logs
        if: always()
        run: docker compose -f docker/docker-compose-test.yml logs

  # The three packages' sdists and wheels, built once with the version set.
  build-packages:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Python setup
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Set the version in packages/__packaging__.py
        env:
          PYPI_VERSION: ${{ needs.version.outputs.pypi }}
        run: |
          sed -i "s/__version__ = VERSION_STRING/__version__ = \"$PYPI_VERSION\"/" packages/__packaging__.py
          # If the sed stops matching, the packages would be built and uploaded as 0.0.0
          if ! grep -qF "__version__ = \"$PYPI_VERSION\"" packages/__packaging__.py; then
            echo "::error::packages/__packaging__.py does not carry the version '$PYPI_VERSION'"
            exit 1
          fi

      - name: Build every sub-packages
        run: |
          # Python 3.14 comes without setuptools, which every setup.py imports.
          pip install setuptools==84.2.1 wheel==0.48.0

          # Helper: rename sdist to use underscores in package name (PEP 625). Newer setuptools
          # already writes that name, so a file whose name is unchanged is left alone.
          normalize_sdist() {
            for f in dist/*.tar.gz; do
              nf=$(echo "$f" | python3 -c "
          import sys, re
          f = sys.stdin.read().strip()
          # Replace hyphens in package name portion only (before version number)
          nf = re.sub(r'^(dist/)([a-zA-Z][a-zA-Z0-9_-]*?)(-\d)', lambda m: m.group(1) + m.group(2).replace('-', '_') + m.group(3), f)
          print(nf)
          ")
              if [ "$f" != "$nf" ]; then
                mv "$f" "$nf"
                echo "Renamed $f -> $nf"
              fi
            done
          }

          for package in opal-common opal-client opal-server; do
            (
              cd "packages/$package"
              rm -rf ./*.egg-info build/ dist/
              python setup.py sdist bdist_wheel
              normalize_sdist
            )
          done

      - name: Keep the packages for the jobs that test and publish them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: packages
          path: packages/opal-*/dist/
          if-no-files-found: error
          retention-days: 3

  # The built wheels, installed on the Python they require into a new venv: pip finds their
  # dependencies, every package imports, and each reports the release version.
  test-packages:
    needs: [version, build-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Python setup
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install and import the wheels
        env:
          PACKAGES: ${{ runner.temp }}/packages
          EXPECTED: ${{ needs.version.outputs.pypi }}
        run: |
          venv=$RUNNER_TEMP/venv
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet pip==26.2.2
          "$venv/bin/pip" install "$PACKAGES"/opal-common/dist/*.whl \
            "$PACKAGES"/opal-client/dist/*.whl "$PACKAGES"/opal-server/dist/*.whl
          "$venv/bin/pip" check
          for package in opal-common opal-client opal-server; do
            actual=$("$venv/bin/pip" show "$package" | sed -n 's/^Version: //p')
            echo "$package $actual"
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::the $package wheel is version '$actual', expected '$EXPECTED'"
              exit 1
            fi
          done
          "$venv/bin/python" -c 'import opal_common, opal_client, opal_server'

  # On a release only, once every image and package passed: each archive is copied to Docker Hub
  # as it is, so the tags name the bytes that were tested. A GA release also moves latest.
  #
  # The only job that can write to Docker Hub, and it holds no stored credential: no job in this
  # repository does. Docker Hub's OIDC connection for the OPAL image repositories grants Image
  # Push only to the subject repo:permitio/opal:environment:docker-hub, this job's, and the token
  # it mints lives for 10 minutes. Every other job pulls anonymously; the connection's rule for
  # repo:permitio/opal:* is pull only.
  publish-images:
    if: github.event_name == 'release'
    needs: [version, test-images, test-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: docker-hub
    permissions:
      id-token: write  # the GitHub ID token Docker Hub exchanges for the short-lived token
    # Never at the same time as the weekly rebuild's copy of the same repository.
    concurrency:
      group: docker-hub-${{ matrix.repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            repository: permitio/opal-client
          - name: client-standalone
            repository: permitio/opal-client-standalone
          - name: client-cedar
            repository: permitio/opal-client-cedar
          - name: client-eopa
            repository: permitio/opal-client-eopa
          - name: server
            repository: permitio/opal-server
    steps:
      - name: Fetch the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image

      # No password: that selects the OIDC flow. The username is the Docker organization (OIDC
      # does not work for personal accounts). If the exchange fails, the connection's Failures
      # tab in Docker Home shows the subject it received.
      - name: Login to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '600'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Publish ${{ matrix.name }}
        env:
          ARCHIVE: ${{ runner.temp }}/image/image.tar
          REPOSITORY: ${{ matrix.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Fail before any copy if the login left nothing skopeo can read, rather than with an
          # anonymous copy's 401.
          if ! skopeo login --get-login docker.io >/dev/null; then
            echo "::error::the Docker Hub login left no credential skopeo can read; nothing was published"
            exit 1
          fi
          tags=("$TAG")
          if [ "$PRERELEASE" != "true" ]; then
            tags+=(latest)
          fi
          built=$(skopeo inspect --raw "oci-archive:$ARCHIVE" | sha256sum | cut -d' ' -f1)
          for tag in "${tags[@]}"; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              "oci-archive:$ARCHIVE" "docker://$REPOSITORY:$tag"
            pushed=$(skopeo inspect --raw "docker://$REPOSITORY:$tag" | sha256sum | cut -d' ' -f1)
            if [ "$pushed" != "$built" ]; then
              echo "::error::$REPOSITORY:$tag is sha256:$pushed, not the tested sha256:$built"
              exit 1
            fi
            echo "$REPOSITORY:$tag is sha256:$built, the image that was tested"
          done
          echo "sha256:$built" >"$RUNNER_TEMP/digest"

      - name: Keep the pushed digest for verify
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 3

  # On a release only, once every image and package passed: the tested sdists and wheels go to
  # the release's assets (release-assets) and to PyPI (publish-packages).
  release-assets:
    if: github.event_name == 'release'
    needs: [version, test-images, test-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # upload the dists to the release
    steps:
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: packages
          path: packages

      # Upload package distributions to the release - All assets in one step
      - name: Upload assets to release
        uses: shogo82148/actions-upload-release-asset@8f032eff0255912cc9c8455797fd6d72f25c7ab7  # v1.7.5
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: |
            packages/opal-common/dist/*
            packages/opal-client/dist/*
            packages/opal-server/dist/*

  # Trusted publishing: PyPI accepts an OIDC token of this workflow in the pypi environment,
  # which each of the three projects lists as its trusted publisher. No PyPI token is stored.
  # Every step of a job that may mint that token could publish, so this job holds nothing else
  # and runs only the artifact download and the publish action; the release assets are
  # release-assets' job, with no OIDC token.
  publish-packages:
    if: github.event_name == 'release'
    needs: [version, test-images, test-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/opal-common/
    permissions:
      id-token: write  # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: packages
          path: packages

      # Publish package distributions to PyPI, each with the attestation the action makes with
      # trusted publishing. skip-existing allows re-runs to succeed if some files were already
      # uploaded; verbose enables detailed error messages from PyPI for debugging upload failures.
      - name: Publish package distributions to PyPI - Opal-Common
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/opal-common/dist/
          skip-existing: true
          verbose: true

      - name: Publish package distributions to PyPI - Opal-Client
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/opal-client/dist/
          skip-existing: true
          verbose: true

      - name: Publish package distributions to PyPI - Opal-Server
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/opal-server/dist/
          skip-existing: true
          verbose: true

  # On a release only, after both publish jobs: what Docker Hub and PyPI now serve must carry its
  # attestations. Each image index is read by the digest publish-images pushed, which is the
  # tested archive's, so a tag moved since cannot change what is checked: it holds exactly the
  # linux/amd64 and linux/arm64 images, each with an SLSA provenance that names this repository,
  # the release commit and the image's Dockerfile target, and an SPDX SBOM that lists
  # opal-common. Each package file on PyPI has an attestation published by this workflow in the
  # pypi environment.
  verify:
    if: github.event_name == 'release'
    needs: [version, publish-images, publish-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pushed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      - name: Check each image's platforms, provenance and SBOM
        env:
          DIGESTS: ${{ runner.temp }}/digests
          COMMIT: ${{ github.sha }}
        run: |
          code=0
          for name in client client-standalone client-cedar client-eopa server; do
            digest=$(cat -- "$DIGESTS/digest-$name/digest")
            digest=${digest#sha256:}
            .github/scripts/verify_release.py image "permitio/opal-$name@sha256:$digest" \
              --target "$name" --commit "$COMMIT" --repository "$GITHUB_REPOSITORY" || code=1
          done
          exit "$code"

      - name: Check each package file's PyPI attestation
        env:
          PYPI_VERSION: ${{ needs.version.outputs.pypi }}
        run: >-
          .github/scripts/verify_release.py packages "$PYPI_VERSION"
          --project opal-common --project opal-client --project opal-server
          --repository "$GITHUB_REPOSITORY" --workflow on_release.yml --environment pypi

  # On a release only, when any job failed or was cancelled: a notice to the security Slack channel
  # that names those jobs, through .github/scripts/notify.sh and the webhook of the security-scan
  # environment, which must admit release tags too. A dry run on a pull request posts nothing.
  notify:
    needs:
      - version
      - build-images
      - test-images
      - build-packages
      - test-packages
      - publish-images
      - release-assets
      - publish-packages
      - verify
    if: always() && github.event_name == 'release' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: security-scan
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Post to Slack
        env:
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ github.event.release.tag_name }}
          SECURITY_SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
        run: |
          body=$RUNNER_TEMP/failed-jobs.txt
          jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")
            | "• \(.key): \(.value.result)"' <<<"$NEEDS" >"$body"
          .github/scripts/notify.sh "release $TAG" "failed" "$body"
