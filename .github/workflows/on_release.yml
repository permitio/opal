name: Build and publish to Docker Hub
on:
  release:
    # job will automatically run after a new "release" is create on github.
    types: [published]

# Each job grants itself only what it uses.
permissions: {}

# The actions below stay on the majors this workflow has released with, pinned to the commit
# those majors pointed at; Dependabot proposes newer majors as separate PRs.
jobs:
  # Validate that the release tag and prerelease flag are consistent.
  # Pre-releases must have a semver prerelease identifier (rc, beta, alpha, dev)
  # and GA releases must not.
  validate_release:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate release tag matches prerelease flag
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Strip optional 'v' prefix for checking
          VERSION="${TAG#v}"
          # Check if the tag contains a prerelease identifier (hyphen after version numbers)
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
            TAG_IS_PRERELEASE="true"
          else
            TAG_IS_PRERELEASE="false"
          fi
          echo "Tag: $TAG, tag_is_prerelease: $TAG_IS_PRERELEASE, release_is_prerelease: $IS_PRERELEASE"
          if [ "$IS_PRERELEASE" = "true" ] && [ "$TAG_IS_PRERELEASE" = "false" ]; then
            echo "::error::Release is marked as pre-release but tag '$TAG' has no pre-release identifier (e.g. -rc1, -beta1, -alpha1). Pre-release tags must include a semver pre-release suffix."
            exit 1
          fi
          if [ "$IS_PRERELEASE" = "false" ] && [ "$TAG_IS_PRERELEASE" = "true" ]; then
            echo "::error::Tag '$TAG' has a pre-release identifier but the release is not marked as pre-release. Either mark the release as pre-release or use a GA tag (e.g. 0.8.0)."
            exit 1
          fi
          echo "Validation passed."

  # Build once, run e2e validation, and only then fan out to publish variants
  build_and_test:
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc  # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Echo version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "The version tag that will be published to docker hub is: $RELEASE_TAG"

      # Release images build without a registry cache: layers from an earlier image must not
      # end up in a release.
      - name: Build client for testing
        id: build_client
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          target: client
          load: true
          tags: |
            permitio/opal-client:test

      - name: Build server for testing
        id: build_server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          target: server
          load: true
          tags: |
            permitio/opal-server:test

      - name: Create modified docker compose file
        run: sed 's/:latest/:test/g' docker/docker-compose-example.yml > docker/docker-compose-test.yml

      - name: Bring up stack
        run: docker compose -f docker/docker-compose-test.yml up -d

      - name: Check if OPA is healthy
        run: ./scripts/wait-for.sh -t 60 http://localhost:8181/v1/data/users -- sleep 10 && curl -s "http://localhost:8181/v1/data/users" | jq '.result.bob.location.country == "US"'

      - name: Output container logs
        run: docker compose -f docker/docker-compose-test.yml logs

      - name: Output local docker images
        run: docker image ls --digests | grep opal

  publish_docker_images:
    needs:
      - build_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            repository: permitio/opal-client
            target: client
            version_suffix: ""
          - name: client-alpine
            repository: permitio/opal-client
            target: client-alpine
            version_suffix: "-alpine"
          - name: client-standalone
            repository: permitio/opal-client-standalone
            target: client-standalone
            version_suffix: ""
          - name: client-standalone-alpine
            repository: permitio/opal-client-standalone
            target: client-standalone-alpine
            version_suffix: "-alpine"
          - name: client-cedar
            repository: permitio/opal-client-cedar
            target: client-cedar
            version_suffix: ""
          - name: client-cedar-alpine
            repository: permitio/opal-client-cedar
            target: client-cedar-alpine
            version_suffix: "-alpine"
          - name: client-eopa
            repository: permitio/opal-client-eopa
            target: client-eopa
            version_suffix: ""
          - name: client-eopa-alpine
            repository: permitio/opal-client-eopa
            target: client-eopa-alpine
            version_suffix: "-alpine"
          - name: server
            repository: permitio/opal-server
            target: server
            version_suffix: ""
          - name: server-alpine
            repository: permitio/opal-server
            target: server-alpine
            version_suffix: "-alpine"
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc  # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REPOSITORY: ${{ matrix.repository }}
          VERSION_SUFFIX: ${{ matrix.version_suffix }}
        run: |
          version_tag="$RELEASE_TAG"
          repo="$REPOSITORY"
          suffix="$VERSION_SUFFIX"
          latest_tag="latest${suffix}"
          tags="${repo}:${version_tag}${suffix}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            tags="${repo}:${latest_tag}"$'\n'"${tags}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Bump version - packaging__.py
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Install required packages
          pip install semver==3.1.0 packaging==26.3

          # Get version tag and remove 'v' prefix
          version_tag="$RELEASE_TAG"
          version_tag=${version_tag#v}

          # Convert semver to PyPI version using the script
          pypi_version=$(python semver2pypi.py "$version_tag")

          # Update only the __version__ in __packaging__.py
          sed -i "s/__version__ = VERSION_STRING/__version__ = \"$pypi_version\"/" packages/__packaging__.py

          # Print the result for verification
          echo "Original version tag: $version_tag"
          echo "PyPI version: $pypi_version"
          cat packages/__packaging__.py

          # If the sed stops matching, the images would silently install 0.0.0 again
          if [ -z "$pypi_version" ] || ! grep -qF "__version__ = \"$pypi_version\"" packages/__packaging__.py; then
            echo "::error::packages/__packaging__.py does not carry the release version '$pypi_version'"
            exit 1
          fi
          echo "pypi_version=$pypi_version" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # Build from this checkout, which holds the version bump above. Without a context the
          # action builds from the Git context (the tagged commit), and the images installed the
          # packages as 0.0.0. No registry cache, as in build_and_test.
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Check that the pushed image installs the release version
        # Runs after the push, so a version mismatch means these tags already point at the wrong image
        shell: bash
        env:
          IMAGE: ${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          EXPECTED: ${{ steps.version.outputs.pypi_version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          # A registry error or an empty digest is not a wrong version: report it as what it is
          if ! show=$(docker run --rm --platform linux/amd64 --entrypoint pip "$IMAGE" show opal-common); then
            echo "::error::could not read opal-common's version from $IMAGE (see the error above): the image could not be pulled or run, or it does not install opal-common. Check the pushed image by hand before announcing the release."
            exit 1
          fi
          actual=$(printf '%s\n' "$show" | sed -n 's/^Version: //p')
          echo "$IMAGE installs opal-common $actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::$IMAGE installs opal-common '$actual', expected '$EXPECTED'. It is already pushed under the tags below. Re-running this job rebuilds the same commit, so fix the build on the branch and publish a new release; for a GA release, point latest back at the previous version until then."
            echo "Tags now pointing at the wrong image:"
            echo "$TAGS"
            exit 1
          fi

  publish_python_packages:
    needs:
      - build_and_test
    runs-on: ubuntu-latest
    # The pypi environment has no protection rules, so it adds no approval step. PYPI_TOKEN is still
    # a repository secret that any workflow can read; moved into this environment, it would be
    # readable by this job only.
    environment:
      name: pypi
      url: https://pypi.org/p/opal-common/
    permissions:
      contents: write  # upload the dists to the release
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Bump version - packaging__.py
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Install required packages
          pip install semver==3.1.0 packaging==26.3

          # Get version tag and remove 'v' prefix
          version_tag="$RELEASE_TAG"
          version_tag=${version_tag#v}

          # Convert semver to PyPI version using the script
          pypi_version=$(python semver2pypi.py "$version_tag")

          # Update only the __version__ in __packaging__.py
          sed -i "s/__version__ = VERSION_STRING/__version__ = \"$pypi_version\"/" packages/__packaging__.py

          # Print the result for verification
          echo "Original version tag: $version_tag"
          echo "PyPI version: $pypi_version"
          cat packages/__packaging__.py

          # If the sed stops matching, the packages would be built and uploaded as 0.0.0
          if [ -z "$pypi_version" ] || ! grep -qF "__version__ = \"$pypi_version\"" packages/__packaging__.py; then
            echo "::error::packages/__packaging__.py does not carry the release version '$pypi_version'"
            exit 1
          fi

      - name: Build every sub-packages
        run: |
          pip install wheel==0.48.0

          # Helper: rename sdist to use underscores in package name (PEP 625). Newer setuptools
          # already writes that name, so a file whose name is unchanged is left alone.
          normalize_sdist() {
            for f in dist/*.tar.gz; do
              nf=$(echo "$f" | python3 -c "
          import sys, re
          f = sys.stdin.read().strip()
          # Replace hyphens in package name portion only (before version number)
          nf = re.sub(r'^(dist/)([a-zA-Z][a-zA-Z0-9_-]*?)(-\d)', lambda m: m.group(1) + m.group(2).replace('-', '_') + m.group(3), f)
          print(nf)
          ")
              if [ "$f" != "$nf" ]; then
                mv "$f" "$nf"
                echo "Renamed $f -> $nf"
              fi
            done
          }

          cd packages/opal-common/ || exit 1 ; rm -rf ./*.egg-info build/ dist/
          python setup.py sdist bdist_wheel
          normalize_sdist
          cd ../.. || exit 1
          cd packages/opal-client/ || exit 1 ; rm -rf ./*.egg-info build/ dist/
          python setup.py sdist bdist_wheel
          normalize_sdist
          cd ../.. || exit 1
          cd packages/opal-server/ || exit 1 ; rm -rf ./*.egg-info build/ dist/
          python setup.py sdist bdist_wheel
          normalize_sdist
          cd ../.. || exit 1

      # Upload package distributions to the release - All assets in one step
      - name: Upload assets to release
        uses: shogo82148/actions-upload-release-asset@8f032eff0255912cc9c8455797fd6d72f25c7ab7  # v1.7.5
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: |
            packages/opal-common/dist/*
            packages/opal-client/dist/*
            packages/opal-server/dist/*

      # Publish package distributions to PyPI
      # skip-existing allows re-runs to succeed if some files were already uploaded
      # verbose enables detailed error messages from PyPI for debugging upload failures
      # The PyPI token stays until trusted publishing is set up for the three projects; that
      # is its own change.
      - name: Publish package distributions to PyPI - Opal-Common
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}  # zizmor: ignore[use-trusted-publishing] see above
          packages-dir: packages/opal-common/dist/
          skip-existing: true
          verbose: true

      - name: Publish package distributions to PyPI - Opal-Client
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}  # zizmor: ignore[use-trusted-publishing] see above
          packages-dir: packages/opal-client/dist/
          skip-existing: true
          verbose: true

      - name: Publish package distributions to PyPI - Opal-Server
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}  # zizmor: ignore[use-trusted-publishing] see above
          packages-dir: packages/opal-server/dist/
          skip-existing: true
          verbose: true
