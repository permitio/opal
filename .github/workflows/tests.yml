# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # 3.13 leg: opal-common and opal-client only. Their python_requires
        # admits 3.13; opal-server's does not, because its pinned pygit2<1.15
        # ships no cp313 wheel and the sdist needs libgit2 1.7 headers. So this
        # leg cannot install requirements.txt (which pulls in all three) and
        # instead pip-installs the two relaxed packages - with pip, deliberately:
        # uv does not enforce Requires-Python for local path sources, so a uv
        # install here would pass even if the metadata still said <3.13.
        include:
          - python-version: "3.13"
            common-and-client-only: true

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        if [ "${{ matrix.common-and-client-only }}" = "true" ]; then
          pip install -e ./packages/opal-common -e ./packages/opal-client \
            pytest pytest-asyncio pytest-rerunfailures
        else
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f ./tests/requirements.txt ]; then pip install -r ./tests/requirements.txt; fi
        fi
    # opa_argv_real_binary_test.py hands the argv OPAL generates to the REAL
    # binary. Without it those assertions SKIP, and the inline-OPA regression
    # they exist for is python-version-gated - it is invisible on 3.10 and fatal
    # on 3.11+ - so they need to run on every leg of this matrix, not just
    # wherever a developer happens to have opa installed.
    - name: Install OPA (for the inline-OPA argv tests)
      run: |
        curl -fsSL -o /usr/local/bin/opa \
          https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static
        chmod +x /usr/local/bin/opa
        opa version
      env:
        # pinned: an unpinned `latest` would make a flag rename look like our bug
        OPA_VERSION: 1.20.2
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        if [ "${{ matrix.common-and-client-only }}" = "true" ]; then
          # These three need a running/importable opal-server, which this leg
          # cannot install (see the matrix note). Everything else in the two
          # relaxed packages runs - including the wire_compat corpus, the enum
          # inventory sweep and the real-binary OPA argv tests.
          pytest packages/opal-common packages/opal-client \
            --ignore=packages/opal-common/opal_common/tests/test_config.py \
            --ignore=packages/opal-client/opal_client/tests/data_updater_test.py \
            --ignore=packages/opal-client/opal_client/tests/server_to_client_intergation_test.py
        else
          pytest
        fi

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: E2E Tests
    steps:
      # BUILD PHASE
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Docker Compose install
        run: |
          curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Build client
        id: build_client
        uses: docker/build-push-action@v2
        with:
          file: docker/Dockerfile
          push: false
          target: client
          cache-from: type=registry,ref=permitio/opal-client:latest
          cache-to: type=inline
          load: true
          tags: |
            permitio/opal-client:test

      - name: Build server
        id: build_server
        uses: docker/build-push-action@v2
        with:
          file: docker/Dockerfile
          push: false
          target: server
          cache-from: type=registry,ref=permitio/opal-server:latest
          cache-to: type=inline
          load: true
          tags: |
            permitio/opal-server:test

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install opal packages
        run: |
          python -m pip install -e ./packages/opal-common
          python -m pip install -e ./packages/opal-client
          python -m pip install -e ./packages/opal-server

      - name: App Tests
        working-directory: ./app-tests
        env:
          OPAL_IMAGE_TAG: test
          OPAL_TESTS_POLICY_REPO_DEPLOY_KEY: ${{ secrets.OPAL_TESTS_POLICY_REPO_DEPLOY_KEY }}
        run: |
          # Prepare git for using tests policy repo
          export OPAL_POLICY_REPO_SSH_KEY_PATH=$(realpath .)/opal-tests-policy-repo-key
          echo "$OPAL_TESTS_POLICY_REPO_DEPLOY_KEY" > $OPAL_POLICY_REPO_SSH_KEY_PATH
          chmod 400 $OPAL_POLICY_REPO_SSH_KEY_PATH

          git config --global core.sshCommand "ssh -i $OPAL_POLICY_REPO_SSH_KEY_PATH -o IdentitiesOnly=yes"
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "<>"

          ./run.sh

  e2e-tests-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: E2E Tests (Alpine)
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Docker Compose install
        run: |
          curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Build client (alpine)
        id: build_client_alpine
        uses: docker/build-push-action@v2
        with:
          file: docker/Dockerfile
          push: false
          target: client-alpine
          cache-from: type=registry,ref=permitio/opal-client:latest-alpine
          cache-to: type=inline
          load: true
          tags: |
            permitio/opal-client:test-alpine

      - name: Build server (alpine)
        id: build_server_alpine
        uses: docker/build-push-action@v2
        with:
          file: docker/Dockerfile
          push: false
          target: server-alpine
          cache-from: type=registry,ref=permitio/opal-server:latest-alpine
          cache-to: type=inline
          load: true
          tags: |
            permitio/opal-server:test-alpine

      - name: Create alpine docker compose file
        run: sed 's/:latest-alpine/:test-alpine/g' docker/docker-compose-example-alpine.yml > docker/docker-compose-test-alpine.yml

      - name: Bring up alpine stack
        run: docker compose -f docker/docker-compose-test-alpine.yml up -d

      - name: Check if inline OPA is healthy (alpine)
        run: ./scripts/wait-for.sh -t 60 http://localhost:8181/v1/data/users -- sleep 10 && curl -s "http://localhost:8181/v1/data/users" | jq '.result.bob.location.country == "US"'

      - name: Output container logs (alpine)
        run: docker compose -f docker/docker-compose-test-alpine.yml logs
