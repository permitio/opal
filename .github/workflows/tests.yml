# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ master, 'release/**' ]
  # No base-branch filter: a PR stacked on another PR's branch gets the full CI too.
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs; runs on master and release branches are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # With the docker-container builder that setup-buildx-action creates, buildx (>= 0.30)
  # adds the GitHub event payload to the build's provenance and writes that provenance
  # into the metadata file even in its default `min` mode. build-push-action prints the
  # metadata file in a "Metadata" log group, so a pull_request run would put the PR title
  # and description from the triggering event (re-runs reuse it) into this public repo's
  # logs, where editing the description later cannot remove them. Set for the whole
  # workflow so a build job added later is covered too.
  BUILDX_METADATA_PROVENANCE: disabled
  # build-push-action (>= v6) also uploads each build's record, provenance included, as a
  # workflow artifact that any signed-in GitHub user can download from this public repo's
  # runs. These builds are only loaded for the tests, so nothing needs the record.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    permissions:
      contents: read
    services:
      redis:
        image: redis:8.10.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # Every leg reports its own result; with fail-fast one failing leg
      # cancels the others and hides whether they pass.
      fail-fast: false
      matrix:
        # The one Python the packages' python_requires admits.
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install pip==26.2.2
        python -m pip install flake8==7.5.0
        pip install -r requirements.txt
    # opa_argv_real_binary_test.py hands the argv OPAL generates to the REAL
    # binary. Without it those assertions SKIP. How the enums in that argv
    # render has changed with the python version before (Enum.__format__ in
    # 3.11), so they run on every leg of this matrix.
    - name: Install OPA (for the inline-OPA argv tests)
      run: |
        # --retry: a dropped connection mid-download failed a whole leg once (curl: (56))
        curl -fsSL --retry 3 --retry-all-errors -o /usr/local/bin/opa \
          "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
        chmod +x /usr/local/bin/opa
        opa version
      env:
        # pinned: an unpinned `latest` would make a flag rename look like our bug
        OPA_VERSION: 1.21.4  # keep equal to the opa-extractor image in docker/Dockerfile
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: pytest

  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: E2E Tests
    permissions:
      contents: read
    steps:
      # BUILD PHASE
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build client
        id: build_client
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          target: client
          cache-from: type=registry,ref=permitio/opal-client:latest
          cache-to: type=inline
          load: true
          tags: |
            permitio/opal-client:test

      - name: Build server
        id: build_server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          target: server
          cache-from: type=registry,ref=permitio/opal-server:latest
          cache-to: type=inline
          load: true
          tags: |
            permitio/opal-server:test

      - name: Check that no test certificate fixture is in the images
        # .dockerignore and docker/Dockerfile's COPY --exclude both keep them out. This fails if
        # one slips back in. These builds read .dockerignore, so they can't show that --exclude
        # works alone; pin it, since a build that skips .dockerignore (docker build <git-url>)
        # has only --exclude.
        run: |
          if [ "$(grep -cF -- 'COPY --exclude=**/tests/*.pem ./packages ./packages/' docker/Dockerfile)" -ne 1 ]; then
            echo "::error::docker/Dockerfile must keep COPY --exclude=**/tests/*.pem in the common stage, for builds that skip .dockerignore"
            exit 1
          fi
          for image in permitio/opal-client:test permitio/opal-server:test; do
            tests=$(docker run --rm --entrypoint sh "$image" -c 'find /opal/packages -path "*/tests/*" -name "*.py" | wc -l')
            found=$(docker run --rm --entrypoint sh "$image" -c 'find /opal/packages -name "*.pem"')
            if [ "$tests" -eq 0 ]; then
              echo "::error::$image: no test modules under /opal/packages, so this check saw nothing"
              exit 1
            fi
            if [ -n "$found" ]; then
              echo "::error::$image carries certificate fixtures:"
              echo "$found"
              exit 1
            fi
            echo "$image: no .pem among $tests test files"
          done

      - name: Check the images' base, Python and user
        # Wolfi, Python 3.14 from the venv at /opt/venv, and the opal user (uid and gid 1000,
        # home /opal) with an /etc/passwd entry, which ssh needs to fetch a policy repo over SSH.
        run: |
          # shellcheck disable=SC2016 # the script runs in the image, which expands it
          check='
            . /etc/os-release
            [ "$ID" = wolfi ] || { echo "the base is $ID, not wolfi"; exit 1; }
            [ "$(command -v python)" = /opt/venv/bin/python ] ||
              { echo "python is $(command -v python), not /opt/venv/bin/python"; exit 1; }
            python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
            [ "$(id -u):$(id -g)" = 1000:1000 ] || { echo "the user is $(id -u):$(id -g)"; exit 1; }
            python -c "import pwd; home = pwd.getpwuid(1000).pw_dir; assert home == \"/opal\", home"
          '
          for image in permitio/opal-client:test permitio/opal-server:test; do
            if ! docker run --rm --entrypoint sh "$image" -c "$check"; then
              echo "::error::$image is not Wolfi with Python 3.14 in /opt/venv and opal 1000:1000 at /opal"
              exit 1
            fi
            echo "$image: Wolfi, Python 3.14 in /opt/venv, opal 1000:1000 with home /opal"
          done

      - name: Gate the images on Trivy and Grype
        # .github/scripts/image_gate.py scans both images with Trivy and with Grype and fails on a
        # fixable HIGH or CRITICAL vulnerability that no waiver in force in
        # .github/image-waivers.toml covers. The job summary lists what blocked and what is waived.
        # The steps after it still run when the gate failed (they publish nothing), so a finding
        # the pull request did not cause does not hide what its E2E does; never after a cancel.
        id: gate
        run: >-
          .github/scripts/image_gate.py --summary "$GITHUB_STEP_SUMMARY"
          permitio/opal-client:test permitio/opal-server:test

      - name: Check that an image built FROM the client adds a package with pip install --user
        if: ${{ !cancelled() && (success() || steps.gate.outcome == 'failure') }}
        # The docs add a custom fetch provider this way. The venv keeps the user site for it. The
        # default builder is the one that sees the image loaded above.
        run: |
          dir=$RUNNER_TEMP/derived
          mkdir -p "$dir/opal_fetcher_ci"
          echo 'OK = 1' >"$dir/opal_fetcher_ci/__init__.py"
          printf '%s\n' '[project]' 'name = "opal-fetcher-ci"' 'version = "0"' \
            '[build-system]' 'requires = ["setuptools"]' 'build-backend = "setuptools.build_meta"' \
            >"$dir/pyproject.toml"
          printf '%s\n' 'FROM permitio/opal-client:test' 'COPY --chown=opal . /tmp/fetcher' \
            'RUN pip install --user --no-build-isolation /tmp/fetcher' >"$dir/Dockerfile"
          docker buildx build --builder default --load -t opal-client:derived "$dir"
          docker run --rm --entrypoint python opal-client:derived -c 'import opal_fetcher_ci'

      - name: Set up Python
        if: ${{ !cancelled() && (success() || steps.gate.outcome == 'failure') }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install opal packages
        if: ${{ !cancelled() && (success() || steps.gate.outcome == 'failure') }}
        run: |
          python -m pip install -e ./packages/opal-common
          python -m pip install -e ./packages/opal-client
          python -m pip install -e ./packages/opal-server

      - name: App Tests
        if: ${{ !cancelled() && (success() || steps.gate.outcome == 'failure') }}
        working-directory: ./app-tests
        env:
          OPAL_IMAGE_TAG: test
          OPAL_TESTS_POLICY_REPO_DEPLOY_KEY: ${{ secrets.OPAL_TESTS_POLICY_REPO_DEPLOY_KEY }}
        run: |
          # Prepare git for using tests policy repo
          OPAL_POLICY_REPO_SSH_KEY_PATH="$(realpath .)/opal-tests-policy-repo-key"
          export OPAL_POLICY_REPO_SSH_KEY_PATH
          echo "$OPAL_TESTS_POLICY_REPO_DEPLOY_KEY" > "$OPAL_POLICY_REPO_SSH_KEY_PATH"
          chmod 400 "$OPAL_POLICY_REPO_SSH_KEY_PATH"

          git config --global core.sshCommand "ssh -i $OPAL_POLICY_REPO_SSH_KEY_PATH -o IdentitiesOnly=yes"
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "<>"

          ./run.sh

  binary-stages:
    # The OPA and EOPA extraction stages, for both release architectures. The jobs above
    # build amd64 only, and arm64 builds run only in on_release.yml, so a wrong opa_digest
    # or EOPA checksum after a version bump would otherwise fail only once a release is cut.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the OPA and EOPA stages for linux/amd64 and linux/arm64
        run: |
          for target in opa-extractor eopa-extractor; do
            docker buildx build --platform linux/amd64,linux/arm64 --target "$target" -f docker/Dockerfile .
          done

  # Scans the commits that are new in the run for secrets, with .github/scripts/gitleaks-range.sh
  # and the gitleaks that .github/binaries.lock pins. The range depends on the run:
  #   - a pull request: its commits, from its base to its head. A pull request always adds a
  #     commit, so a range without one did not run.
  #   - a push: from before to after. A push may add no commit, which passes with a notice. A push
  #     that creates a branch sends the zero SHA as before; its range starts at origin/master.
  #   - a manual run: the commits that are not on master. A run on master has none, which passes
  #     with a notice.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A shallow clone lacks the range; gitleaks-range.sh refuses to run on one.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          .github/scripts/fetch-tool.sh gitleaks
      # gitleaks-range.sh in a throwaway repository: a clean range passes, a range that adds a
      # key fails, and a scan that cannot run fails apart from both.
      - name: Test gitleaks-range.sh
        run: .github/scripts/tests/gitleaks-range.test.sh
      - name: Scan the new commits
        env:
          RANGE_BASE: >-
            ${{ (github.event_name == 'workflow_dispatch' || github.event.created)
            && 'origin/master' || github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: >-
            ${{ github.event_name == 'workflow_dispatch' && 'HEAD'
            || github.event.pull_request.head.sha || github.event.after }}
          IF_EMPTY: ${{ github.event_name == 'pull_request' && 'error' || 'notice' }}
        run: .github/scripts/gitleaks-range.sh --if-empty "$IF_EMPTY" "$RANGE_BASE" "$RANGE_HEAD"

  # On a pull request only: fails when the pull request adds a dependency with a known
  # vulnerability of high or critical severity, from GitHub's dependency graph, and on a failure
  # comments the summary on the pull request, which needs pull-requests: write. A fork's token is
  # read-only: the action then warns that it cannot comment, and the result is still the review's.
  # It reads no configuration file from the checkout, and checks out nothing. The graph reads
  # requirements.txt, the docs site's pnpm lockfile and the workflows' actions; it does not read
  # packages/*/requires.txt.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # the action comments its summary on the pull request on a failure
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # On a pull request only: .github/scripts/vuln.sh resolves the ranges the published packages
  # declare (packages/requires.txt and packages/*/requires.txt, which dependency-review does not
  # read) at their floor and at their ceiling, and fails when either tree has a vulnerability of
  # high or critical severity that has a fixed version: raise the floor past it. It downloads uv
  # and Trivy with fetch-tool.sh and runs them without a token. The scheduled security scan
  # resolves and scans the same trees on the default branch.
  vuln:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the floor and the ceiling of the published ranges
        run: .github/scripts/vuln.sh

  ci:
    # The branch ruleset requires only this check, so the jobs above and their
    # matrix legs can be renamed without editing the ruleset. always(): GitHub
    # counts a skipped required check as passing, so this job must run, and
    # fail, when a needed job fails or is cancelled.
    name: CI
    if: always()
    needs: [build, e2e-tests, binary-stages, secrets, dependency-review, vuln]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the CI job needs every other job
        run: |
          workflow=.github/workflows/tests.yml
          # The parentheses matter: yq reads a - b - c as a - (b - c).
          unlisted=$(yq -r '((.jobs | keys) - ["ci"]) - .jobs.ci.needs | .[]' "$workflow")
          unknown=$(yq -r '.jobs.ci.needs - ((.jobs | keys) - ["ci"]) | .[]' "$workflow")
          if [[ -n "$unlisted" ]]; then
            echo "Add these jobs to the needs list of the CI job in $workflow:" >&2
            echo "$unlisted" >&2
          fi
          if [[ -n "$unknown" ]]; then
            echo "These names in the needs list of the CI job in $workflow are not jobs:" >&2
            echo "$unknown" >&2
          fi
          if [[ -n "$unlisted" || -n "$unknown" ]]; then
            exit 1
          fi
      # .github/scripts/ci-aggregate.sh says how it decides: each job must succeed in the runs
      # that select it, and a job in PULL_REQUEST_JOBS is selected on a pull request only.
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          EXPECTED_JOBS: 6
          PULL_REQUEST_JOBS: dependency-review vuln
        run: .github/scripts/ci-aggregate.sh
