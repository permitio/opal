# Mutation testing of the Python code under packages/, with .github/scripts/mutation_gate.py.
#
# On a pull request that changes it: the mutants of the lines the pull request adds or changes, at
# most 300 within a budget of 45 minutes (two constants of the script), each run against the tests
# that cover its line. The check fails when fewer than 80% of the covered mutants that ran are
# killed; the job summary lists the ones that survived.
#
# Weekly and by hand: every line, within five hours, as a report in the job summary.
name: Mutation

on:
  pull_request:
    paths:
      - packages/**/*.py
  schedule:
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions: {}

# A new push to a PR cancels that PR's older run; a scheduled or manual run is never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  mutation:
    runs-on: ubuntu-24.04
    # What a run can take: the install (about 5 minutes), the coverage runs of the changed
    # packages (about 10 for all three; the script allows each up to 40, more than the job has
    # left), the budget, and then the last mutant to start, whose timeout is up to 4 times its
    # tests' own time: when those are the opal-server suite (a line that runs only at import),
    # about 6 minutes, so 24. A pull request: 5 + 10 + 45 + 24 = 84 minutes, so 105 leaves room
    # for a slower runner. Weekly: 5 + 10 + 300 + 24 = 339, so the 360 that GitHub's runners allow.
    # A job that hits this timeout ends with no verdict and no summary.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 105 || 360 }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The diff needs the base's history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # As in tests.yml: without it the inline-OPA tests skip, and the lines only they run look
      # uncovered.
      - name: Install OPA (for the inline-OPA argv tests)
        run: |
          # --retry: a dropped connection mid-download failed a whole leg once (curl: (56))
          curl -fsSL --retry 3 --retry-all-errors -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
        env:
          # pinned: an unpinned `latest` would make a flag rename look like our bug
          OPA_VERSION: 1.21.4  # keep equal to the opa-extractor image in docker/Dockerfile

      - name: Install the packages and the test tools
        run: |
          python -m pip install pip==26.2.2
          pip install -r requirements.txt pytest-cov==7.1.0 coverage==7.17.0

      - name: Mutate the lines this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/mutation_gate.py --base "$BASE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Mutate every line
        if: github.event_name != 'pull_request'
        run: .github/scripts/mutation_gate.py --full --summary "$GITHUB_STEP_SUMMARY"
