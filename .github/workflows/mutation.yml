# Mutation testing of the Python code under packages/, with .github/scripts/mutation_gate.py.
#
# On a pull request that changes it and carries the label "mutation": the mutants of the lines the
# pull request adds or changes, at most 300 within a budget of 150 minutes (two constants of the
# script), each run against the tests that cover its line. The sample and its order are seeded by
# the pull request's base commit, so every push of the same lines runs the same mutants. The check
# fails when fewer than 80% of the covered mutants that ran are killed; the job summary lists the
# ones that survived. When the budget leaves more than 25% of the sample not run, the run is
# inconclusive: the check passes with a warning, and the job summary says how many ran.
#
# Adding the label starts a run, and each push or reopen while it is there starts another. Without
# the label the job is skipped.
#
# Weekly and by hand: every line, within five hours, as a report in the job summary.
name: Mutation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - packages/**/*.py
  schedule:
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions: {}

# A new push to a PR, or adding the label, cancels that PR's older run. Adding any other label
# starts a run whose job is skipped; it gets a group of its own, so that it cancels nothing. A
# scheduled or manual run is never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && (github.event.action != 'labeled' || github.event.label.name == 'mutation')
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  mutation:
    # A pull request runs only with the label, and not when another label is added.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'mutation')
      && (github.event.action != 'labeled' || github.event.label.name == 'mutation'))
    runs-on: ubuntu-24.04
    # What a run can take: the install (about 5 minutes), the coverage runs of the changed
    # packages (about 3 for opal-common and 9 for opal-server, so 15 for all three; the script
    # allows each up to 40, more than the job has left), the budget, and then the last mutant to
    # start, whose timeout is up to 4 times its tests' own time: when those are the opal-server
    # suite (a line that runs only at import), about 6 minutes, so 24. A pull request:
    # 5 + 15 + 150 + 24 = 194 minutes, so 220 leaves room for a slower runner. Weekly:
    # 5 + 15 + 300 + 24 = 344, so the 360 that GitHub's runners allow. A job that hits this
    # timeout ends with no verdict and no summary.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 220 || 360 }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The diff needs the base's history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # As in tests.yml: without it the inline-OPA tests skip, and the lines only they run look
      # uncovered.
      - name: Install OPA (for the inline-OPA argv tests)
        run: |
          # --retry: a dropped connection mid-download failed a whole leg once (curl: (56))
          curl -fsSL --retry 3 --retry-all-errors -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
        env:
          # pinned: an unpinned `latest` would make a flag rename look like our bug
          OPA_VERSION: 1.21.4  # keep equal to the opa-extractor image in docker/Dockerfile

      - name: Install the packages and the test tools
        run: |
          python -m pip install pip==26.2.2
          pip install -r requirements.txt pytest-cov==7.1.0 coverage==7.17.0

      # Exit 3 is inconclusive: the budget left more than a quarter of the sample not run, so the
      # score is no verdict. A job can only pass or fail, and this is neither a pass nor a failure
      # of the change's tests: the step passes, with a warning on the run and the pull request,
      # and the job summary, which the script wrote, says how many mutants ran. Every other exit
      # code is the step's.
      - name: Mutate the lines this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          .github/scripts/mutation_gate.py --base "$BASE" --summary "$GITHUB_STEP_SUMMARY" \
            || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Mutation testing inconclusive::The budget left more than a" \
              "quarter of the sampled mutants not run, so the score is no verdict. The job" \
              "summary says how many ran."
            exit 0
          fi
          exit "$status"

      - name: Mutate every line
        if: github.event_name != 'pull_request'
        run: .github/scripts/mutation_gate.py --full --summary "$GITHUB_STEP_SUMMARY"
