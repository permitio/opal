name: Docs build

on:
  pull_request:
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-build.yml'
    branches: [ master ]
  push:
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-build.yml'
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs; runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Corepack's signature check can fail to download newer pnpm on CI images;
  # documented workaround. The pnpm version is still integrity-pinned by the
  # sha512 hash in documentation/package.json "packageManager".
  COREPACK_INTEGRITY_KEYS: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: documentation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: documentation/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build
