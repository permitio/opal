# Handling DeprecationWarning 'asyncio_mode' default value
[pytest]
asyncio_mode = strict
# Scope the default (rootdir) collection to the unit tests under packages/.
# The heavyweight, docker-compose-driven test bed under app-tests/git-leak/ is
# designed to FAIL on master (it is the regression gate for later PRs) and must
# not be collected by the repo's CI `pytest` run. testpaths only applies when
# pytest is invoked from the rootdir with no args, so running it explicitly
# (e.g. `cd app-tests/git-leak && pytest`) still works.
testpaths = packages
# ddtrace registers a pytest plugin (Datadog Test Optimization). It acts only with --ddtrace,
# but pytest loads it into every run, and loading it imports ddtrace before conftest.py can set
# DD_TRACE_ENABLED=false: the test process then traces, and the trace writer ddtrace 4 starts
# for that sat next to tests that fork servers, which hung the opal-server tests on CI. OPAL does
# not use Test Optimization, so the plugin is not loaded. See conftest.py.
addopts = -p no:ddtrace
