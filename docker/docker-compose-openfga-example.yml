name: opal-openfga-example

services:
  broadcast_channel:
    image: postgres:alpine
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  openfga_data_nginx:
    image: nginx:latest
    volumes:
      - "./docker_files/openfga_data:/usr/share/nginx/html:ro"

  openfga_primary:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"

  openfga_secondary:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8082:8080"

  opal_server:
    image: permitio/opal-server:latest
    environment:
      - OPAL_BROADCAST_URI=postgres://postgres:postgres@broadcast_channel:5432/postgres
      - UVICORN_NUM_WORKERS=4
      - OPAL_POLICY_REPO_URL=https://github.com/permitio/opal-example-policy-repo.git
      - OPAL_POLICY_REPO_POLLING_INTERVAL=30
      - OPAL_DATA_CONFIG_SOURCES={"config":{"entries":[{"url":"http://openfga_data_nginx/data.json","topics":["policy_data"],"dst_path":""}]}}
      - OPAL_LOG_FORMAT_INCLUDE_PID=true
      # Configure OPAL server to track OpenFGA policy files (.fga / .json)
      - OPAL_FILTER_FILE_EXTENSIONS=.fga:.json
      - OPAL_POLICY_REPO_POLICY_EXTENSIONS=.fga:.json
    ports:
      - "7002:7002"
    depends_on:
      - broadcast_channel

  opal_client_1:
    image: permitio/opal-client:latest
    environment:
      - OPAL_SERVER_URL=http://opal_server:7002
      - OPAL_LOG_FORMAT_INCLUDE_PID=true
      - OPAL_INLINE_OPA_ENABLED=false
      - OPAL_POLICY_STORE_TYPE=OPENFGA
      - OPAL_POLICY_STORE_URL=http://openfga_primary:8080
      - OPAL_OPENFGA_STORE_NAME=opal-rebac-primary
    ports:
      - "7766:7000"
    depends_on:
      - opal_server
      - openfga_primary
    command: sh -c "exec ./wait-for.sh opal_server:7002 --timeout=20 -- ./start.sh"
    links:
      - openfga_data_nginx

  opal_client_2:
    image: permitio/opal-client:latest
    environment:
      - OPAL_SERVER_URL=http://opal_server:7002
      - OPAL_LOG_FORMAT_INCLUDE_PID=true
      - OPAL_INLINE_OPA_ENABLED=false
      - OPAL_POLICY_STORE_TYPE=OPENFGA
      - OPAL_POLICY_STORE_URL=http://openfga_secondary:8080
      - OPAL_OPENFGA_STORE_NAME=opal-rebac-secondary
    ports:
      - "7767:7000"
    depends_on:
      - opal_server
      - openfga_secondary
    command: sh -c "exec ./wait-for.sh opal_server:7002 --timeout=20 -- ./start.sh"
    links:
      - openfga_data_nginx
