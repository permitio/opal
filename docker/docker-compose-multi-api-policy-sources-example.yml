name: opal-multi-api-policy-sources-example

services:
  broadcast_channel:
    image: postgres:alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  opal_server:
    image: permitio/opal-server:latest
    environment:
      OPAL_BROADCAST_URI: postgres://postgres:postgres@broadcast_channel:5432/postgres
      OPAL_POLICY_SOURCE_TYPE: API
      OPAL_POLICY_REPO_CLONE_PATH: /tmp/opal
      OPAL_POLICY_REPO_POLLING_INTERVAL: "30"
      OPAL_POLICY_BUNDLE_SOURCES: >-
        {"sources":[{"source_id":"bundle-a","url":"http://api_policy_source_server","filename":"bundle.tar.gz"}]}
      OPAL_DATA_CONFIG_SOURCES: >-
        {"config":{"entries":[{"url":"http://opal_server:7002/policy-data","topics":["policy_data"],"dst_path":"/static"}]}}
    ports:
      - "7002:7002"
    depends_on:
      - broadcast_channel

  opal_client:
    image: permitio/opal-client:latest
    environment:
      OPAL_SERVER_URL: http://opal_server:7002
      OPAL_POLICY_SOURCE_IDS: bundle-a
    ports:
      - "7766:7000"
      - "8181:8181"
    depends_on:
      - opal_server
    command: sh -c "exec ./wait-for.sh opal_server:7002 --timeout=20 -- ./start.sh"

  api_policy_source_server:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker_files/bundle_files:/usr/share/nginx/html
      - ./docker_files/nginx.conf:/etc/nginx/nginx.conf