# Head-to-head override (old vs new opal_server image), used ONLY by
# head_to_head.py via `docker compose -f docker-compose.yml -f hh-override.yml`.
# The base compose (and the pytest gate) never load this file.
#
# Two changes vs base:
#  1. opal_server runs a PREBUILT image tag (HH_IMAGE) instead of building from
#     the working tree, so we can swap old<->new without a rebuild. pull_policy
#     never keeps it local-only (both tags are built locally by the harness).
#  2. a `slowfail` socat sidecar: accepts the TCP handshake, sleeps T_HANG, then
#     closes the connection -> the git clone fails after ~T_HANG seconds,
#     IMAGE-INDEPENDENTLY (mirrors prod's finite ~30-212s broken-repo tail,
#     unlike `blackhole` which hangs for an hour). This lets BOTH images
#     complete the boot, giving comparable wall-clock numbers.
services:
  opal_server:
    image: "${HH_IMAGE:-opal-server:new}"
    pull_policy: never

  slowfail:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:80,fork,reuseaddr", "SYSTEM:sleep ${HH_HANG_SECONDS:-25}"]
